name: Publish PS4 9.00 host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload approved PS4 host
        uses: actions/upload-pages-artifact@v3
        with:
          path: .gamezone-runtime/ps4-startup-900
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
